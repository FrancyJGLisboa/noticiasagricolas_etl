  unit: R$/ton
  source: Regional cooperatives
  frequency: daily
  description: >-
    Domestic soybean meal spot prices in reais per ton from
    cooperatives and industry sources.
- commodity: soja
  slug: oleo-de-soja-chicago-cbot
  name: Óleo de Soja - Bolsa de Chicago
  page_type: cme_futures
  unit: US cents/lb
  source: CME Group / CBOT
  frequency: daily
  description: >-
    CBOT soybean oil futures settlement prices in US cents
