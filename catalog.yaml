  page_type: indicator
  unit: R$
  source: Cepea/Esalq (USP)
  frequency: daily
  description: >-
    Soybean reference price for Paraná state, calculated by
    Cepea/Esalq based on spot market transactions.
- commodity: soja
  slug: soja-bolsa-de-chicago-cme-group
  name: Soja - Bolsa de Chicago
  page_type: cme_futures
  unit: US$ / Bushel
  source: CME Group / CBOT
  frequency: daily
  description: >-
    CBOT soybean futures settlement prices in US dollars per
    bushel. Multiple contract months available.
- commodity: soja
  slug: premio-soja-paranagua-pr
  name: Prêmio Soja Paranaguá/PR
  page_type: physical_market
  unit: cents/bu
  source: Regional cooperatives
  frequency: daily
  description: >-
    Soybean export premium at Paranaguá port over CBOT reference,
    in US cents per bushel.
- commodity: soja
  slug: soja-b3-pregao-regular
  name: Soja CME - B3 (Pregão Regular)
  page_type: b3_futures
  unit: US$/sc 60 kg
  source: B3 (Brasil Bolsa Balcão)
  frequency: daily
  description: >-
    B3 soybean futures (CME-linked contract) settlement prices
    in US dollars per 60 kg sack.
- commodity: soja
  slug: soja-mercado-fisico-sindicatos-e-cooperativas
  name: Soja - Mercado Físico
  page_type: physical_market
  unit: R$/Sc de 60 kg
  source: Regional cooperatives
  frequency: daily
  description: >-
    Soybean spot prices collected from cooperatives and trade
    unions across multiple Brazilian states.
- commodity: soja
  slug: farelo-de-soja-chicago-cbot
  name: Farelo de Soja - Bolsa de Chicago
  page_type: cme_futures
  unit: US$/short ton
  source: CME Group / CBOT
