# ── SOJA (13 indicators) ─────────────────────────────────────────────────────
- commodity: soja
  slug: soja-indicador-cepea-esalq-porto-paranagua
  name: Indicador da Soja ESALQ/B3 - Paranaguá
  page_type: indicator
  unit: R$
  source: Cepea/Esalq (USP)
  frequency: daily
  description: >-
    Reference soybean price at Paranaguá port. Settlement price
    for B3 soybean futures contracts.
- commodity: soja
  slug: indicador-cepea-esalq-soja-parana
