name: Daily Update

# Runs every weekday at 22:00 UTC (19:00 BRT / Brasilia Time)
on:
  schedule:
    - cron: "0 22 * * 1-5"
  workflow_dispatch: {} # allows manual trigger from GitHub UI

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    steps:
      # ── 1. Setup ──────────────────────────────────────────────
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -e ".[dev,api]"

      # config.py expects BASE_DIR = ~/noticiasagricolas_etl
      # On GitHub Actions the workspace is elsewhere, so symlink it.
      - name: Link workspace to expected path
        run: ln -s "$GITHUB_WORKSPACE" ~/noticiasagricolas_etl

      # ── 2. Restore data from previous run ─────────────────────
      #    Parquet + state are stored as a GitHub Release artifact
      #    so they persist indefinitely between runs.
      - name: Download previous data
        run: |
          echo "Downloading data from latest release..."
          mkdir -p /tmp/data-dl
          gh release download data-latest \
            --pattern "etl-data.tar.gz" \
            --dir /tmp/data-dl 2>/dev/null || true

          if [ -f /tmp/data-dl/etl-data.tar.gz ]; then
            echo "Restoring previous data..."
            tar xzf /tmp/data-dl/etl-data.tar.gz
            echo "Restored."
            du -sh data/parquet/ data/parquet_basis/ data/state/ 2>/dev/null || true
          else
            echo "No previous data found — starting fresh."
            mkdir -p data/parquet data/parquet_basis data/csv data/state
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 3. Run the daily update ───────────────────────────────
      #    Step 1: scrape latest prices (all 158 indicators)
      #    Step 2: export CSVs from Parquet
      #    Step 3: rebuild basis time series
      - name: Run daily update
        run: na-etl daily

      - name: Show summary
        run: |
          echo "=== Data sizes after update ==="
          du -sh data/parquet/ data/parquet_basis/ data/csv/ data/state/ 2>/dev/null || true
          echo ""
          echo "=== CSV row counts ==="
          wc -l data/csv/*.csv 2>/dev/null | tail -5
          echo ""
          echo "=== Basis CSV row counts ==="
          wc -l data/csv/basis-*.csv 2>/dev/null || echo "No basis CSVs yet"

      # ── 4. Save Parquet + CSV + state to GitHub Release ───────
      #    Tarball includes everything (parquet for fast Python loading,
      #    CSVs for archival, state for next run's resume).
      - name: Upload data to release
        run: |
          echo "Packing Parquet + CSV + state..."
          tar czf /tmp/etl-data.tar.gz \
            data/parquet/ \
            data/parquet_basis/ \
            data/csv/ \
            data/state/
          ls -lh /tmp/etl-data.tar.gz

          echo "Uploading to release..."
          gh release delete data-latest --yes 2>/dev/null || true
          gh release create data-latest /tmp/etl-data.tar.gz \
            --title "ETL Data (auto-updated)" \
            --notes "Last updated: $(date -u +%Y-%m-%d\ %H:%M\ UTC)" \
            --latest=false
          echo "Done."
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ── 5. Publish CSVs + Plotly charts to 'data' branch ──────
      #    Single-commit orphan branch: repo on main never grows,
      #    but raw URLs stay accessible for browser preview / pandas / curl:
      #
      #      https://raw.githubusercontent.com/<owner>/<repo>/data/csv/basis-soja.csv
      #      https://raw.githubusercontent.com/<owner>/<repo>/data/charts/seasonality.html
      #
      #    The branch is force-pushed each run so it has exactly one commit.
      - name: Publish CSVs and charts to data branch
        run: |
          set -e
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Use a worktree so we don't disturb main's checkout.
          # --orphan creates a new branch with no parent commits.
          git worktree add --orphan -b data-publish /tmp/data-publish

          # Place CSVs at csv/ (root of the data branch) so the URL stays clean
          mkdir -p /tmp/data-publish/csv
          cp data/csv/*.csv /tmp/data-publish/csv/

          # Place charts at charts/ if any were generated (na-etl daily step 4)
          if compgen -G "data/charts/*.html" > /dev/null; then
            mkdir -p /tmp/data-publish/charts
            cp data/charts/*.html /tmp/data-publish/charts/
          fi

          # README + Pages-friendly index.html linking to charts and CSVs
          cat > /tmp/data-publish/README.md <<EOF
          # data branch — auto-published daily

          This branch is **force-pushed daily** by \`.github/workflows/daily-update.yml\`.
          It always contains exactly one commit — never commit here, your changes will be wiped.

          Code lives on \`main\`. Bulk binary data (parquet) lives in the \`data-latest\`
          GitHub Release. This branch exposes CSVs and charts via raw URLs.

          ## Charts (interactive Plotly HTMLs)

          Open in browser via GitHub Pages (if enabled on this branch) or via
          \`htmlpreview.github.io\`:

            https://htmlpreview.github.io/?https://github.com/FrancyJGLisboa/noticiasagricolas_etl/blob/data/charts/seasonality.html

          ## CSVs (raw URLs, consumable directly)

          \`\`\`python
          import pandas as pd
          BASE = "https://raw.githubusercontent.com/FrancyJGLisboa/noticiasagricolas_etl/data/csv"
          df = pd.read_csv(f"{BASE}/basis-soja.csv", parse_dates=["date"])
          \`\`\`

          ---
          Last updated: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          EOF

          # Pages-friendly index.html (works when GitHub Pages is enabled on data branch)
          cat > /tmp/data-publish/index.html <<'IDX_EOF'
          <!DOCTYPE html>
          <html lang="pt-BR">
          <head>
            <meta charset="utf-8" />
            <title>NoticiasAgricolas ETL — data</title>
            <style>
              body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; max-width: 760px; margin: 40px auto; padding: 0 20px; color: #333; }
              h1 { color: #1f3a5c; border-bottom: 1px solid #ddd; padding-bottom: 8px; }
              h2 { color: #1f3a5c; margin-top: 32px; }
              a { color: #1565c0; text-decoration: none; }
              a:hover { text-decoration: underline; }
              ul { list-style: none; padding: 0; }
              li { padding: 6px 0; }
              code { background: #f5f5f5; padding: 2px 6px; border-radius: 3px; font-size: 90%; }
              .note { background: #fff8e1; padding: 12px; border-radius: 4px; font-size: 90%; }
            </style>
          </head>
          <body>
          <h1>📊 NoticiasAgricolas ETL — branch <code>data</code></h1>
          <p class="note">Branch publicada automaticamente todo dia útil às 19h BRT pelo workflow GitHub Actions. Sempre fresca.</p>
          <h2>Charts (Plotly)</h2>
          <ul>
            <li>📈 <a href="charts/seasonality.html">seasonality.html</a> — climate-normal por praça (Commodity → Vs → Praça)</li>
          </ul>
          <h2>CSVs (raw URLs)</h2>
          <ul>
            <li><code>basis-soja.csv</code> — <a href="csv/basis-soja.csv">view</a></li>
            <li><code>basis-milho.csv</code> — <a href="csv/basis-milho.csv">view</a></li>
            <li><code>basis-cafe.csv</code> — <a href="csv/basis-cafe.csv">view</a></li>
            <li><code>basis-trigo.csv</code> — <a href="csv/basis-trigo.csv">view</a></li>
            <li><code>basis-algodao.csv</code> — <a href="csv/basis-algodao.csv">view</a></li>
            <li><code>basis-boi-gordo.csv</code> — <a href="csv/basis-boi-gordo.csv">view</a></li>
            <li>… plus all individual commodity prices (soja, milho, cafe, etc.)</li>
          </ul>
          <h2>Use with pandas</h2>
          <pre><code>import pandas as pd
          BASE = "https://raw.githubusercontent.com/FrancyJGLisboa/noticiasagricolas_etl/data/csv"
          df = pd.read_csv(f"{BASE}/basis-soja.csv", parse_dates=["date"])</code></pre>
          </body>
          </html>
          IDX_EOF

          cd /tmp/data-publish
          git add csv/ README.md index.html
          [ -d charts ] && git add charts/ || true
          git commit -m "data: $(date -u +%Y-%m-%d)"

          # Force-push so the branch always has exactly one commit
          git push origin data-publish:data --force
          n_csv=$(ls csv/ | wc -l)
          n_html=0
          [ -d charts ] && n_html=$(ls charts/ 2>/dev/null | wc -l)
          echo "Published $n_csv CSVs and $n_html HTMLs to 'data' branch."
