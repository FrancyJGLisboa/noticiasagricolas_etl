[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "noticiasagricolas-etl"
version = "0.1.0"
description = "ETL system for Noticias Agricolas commodity prices"
requires-python = ">=3.10"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "pandas>=2.0",
    "pyarrow>=14.0",
    "click>=8.1",
    "pyyaml>=6.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0", "pytest-cov"]

[project.scripts]
na-etl = "noticiasagricolas_etl.cli:cli"

[tool.setuptools.packages.find]
where = ["src"]
